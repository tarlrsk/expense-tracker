version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - forbidigo
    - gosec
    - misspell
    - noctx
    - sloglint
    - unconvert
  settings:
    depguard:
      # Import rules of ADR-0032.
      rules:
        gorm-only-in-db-and-pg-adaptors:
          list-mode: lax
          files:
            - $all
            - "!**/internal/db/**"
            - "!**/adaptor_pg.go"
            - "!**/adaptor_pg_test.go"
          deny:
            - pkg: gorm.io/
              desc: GORM is allowed only in internal/db and adaptor_pg.go files (ADR-0032)
        gin-only-in-http-layers:
          list-mode: lax
          files:
            - $all
            - "!**/internal/handler/**"
            - "!**/internal/registry/**"
            - "!**/internal/app/**"
            - "!**/internal/middleware/**"
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: gin is allowed only in handler, registry, app and middleware (ADR-0032)
    forbidigo:
      # Adaptors use only the connection of the open transaction, from db.UserConn or db.AuthConn
      # (ADR-0032). From that GORM handle these would reach the root pool (DB, ConnPool,
      # Connection), end or nest the transaction behind internal/db's back (Begin, Transaction,
      # the *sql.Tx in Statement.ConnPool) or open a new pool (gorm.Open). Session is forbidden
      # as a whole: the linter cannot see which gorm.Session fields a call sets. Only internal/db
      # may use them (exclusions below); tests are exempt.
      analyze-types: true
      forbid:
        - pattern: '^gorm\.DB\.(DB|Connection|Begin|Transaction|Session|Commit|Rollback|SavePoint|RollbackTo)$'
          pkg: '^gorm\.io/gorm$'
          msg: only internal/db may use this; adaptors get their connection from db.UserConn or db.AuthConn (ADR-0032)
        - pattern: '^gorm\..*ConnPool$'
          pkg: '^gorm\.io/gorm$'
          msg: the connection pool belongs to internal/db; adaptors get their connection from db.UserConn or db.AuthConn (ADR-0032)
        - pattern: '^gorm\.Open$'
          pkg: '^gorm\.io/gorm$'
          msg: only internal/db opens the database (ADR-0032)
        # Database errors leave an adaptor only through db.Err, which hides their text and keeps
        # their kind (ADR-0067). Error is the field holding a result's error; Row, Rows and
        # ScanRows hand out database/sql values whose errors would bypass db.Err; Statement embeds
        # the *gorm.DB again (Statement.Error, Statement.DB.Error).
        - pattern: '^gorm\.(DB|Statement)\.(Error|Row|Rows|ScanRows|Statement|AddError)$'
          pkg: '^gorm\.io/gorm$'
          msg: return database errors only through db.Err (ADR-0067)
  exclusions:
    rules:
      - path: internal/db/
        linters:
          - forbidigo
      - path: _test\.go$
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/tarlrsk/expense-tracker/api
